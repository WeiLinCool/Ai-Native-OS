[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-os-runtime"
version = "0.1.0"
description = "Dynamic multi-agent orchestration runtime over the AI-Native OS agent specifications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "orchestration", "multi-agent", "llm", "ai-native-os"]

# No required dependencies. Providers speak HTTP through the standard library,
# so the runtime clones and runs with nothing installed.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-native-os = "ai_native_os.cli:main"

[tool.setuptools.packages.find]
include = ["ai_native_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
